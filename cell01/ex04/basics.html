<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics</title>

    <style>
        * {
            background-color: pink;
        }
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: white;
        }
        .img-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        img {
                width: 400px;
        }
        footer {
            display: flex;
            justify-content: end;
            border-top: 1px solid white;
        }
    </style>
</head>
<body>
    <section class="content">
        <h1>Online Shipping</h1>
        <div class="img-container">
            <div class="img-box">
                <img src="https://www.lnwshop.com/system/application/modules/lnwshopweb/_images/store/logo/m_lazada.png" alt="">
                <a href="https://pages.lazada.co.th"><p>@lazada.com</p></a>
            </div>
            <div class="img-box">
                <img src="https://play-lh.googleusercontent.com/mlS7AEDM9Ef-bEd_kc25xhtmJQN6hgpEEd3BQm20kIWMJNKWYfO93tuNJBT9WVcs8oZ9tpHdAPbEXI6FSsyw=s0-br30" alt="">
                <a href="https://www.shopee.co.th"><p>@shopee.com</p></a>
            </div>
        </div>
    </section>
    <footer>
        <p>&copy wil 2026</p>
    </footer>
</body>
</html>
