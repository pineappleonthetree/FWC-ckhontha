<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Calculator</title>
	<link rel="stylesheet" href="calc.css">
</head>
<body>
	<form id="calc-form" class="calculator">
		<h1>Calculator</h1>

		<input type="text" id="left" name="left" placeholder="Left Num">

		<select id="operator" name="operator">
			<option value="+">+</option>
			<option value="-">-</option>
			<option value="*">*</option>
			<option value="/">/</option>
			<option value="%">%</option>
		</select>

		<input type="text" id="right" name="right" placeholder="Right Num">

		<input type="submit" id="submit" value="Try me!">
	</form>

	<script src="calc.js"></script>
</body>
</html>
